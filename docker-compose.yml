services:
  postgres:
    image: postgres:16
    container_name: orderflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - orderflow-data:/var/lib/postgresql/data

volumes:
  orderflow-data: